name: Build Hijoozati APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Hijoozati_Project.zip'
      - 'maintenance/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Project and Install Updated App Source
        run: |
          test -f Hijoozati_Project.zip
          mkdir project
          unzip -q Hijoozati_Project.zip -d project
          test -f project/settings.gradle.kts
          mkdir -p project/app/src/main/java/com/hijoozati/app
          base64 -d maintenance/MainActivity.kt.gz.b64 | gzip -dc > project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          sed -i '/fun bookingsFor(/s/else it.hour})$/else it.hour}}/' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          sed -i '/fun fixedBookings(/s/else it.hour}}$/else it.hour})/' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          perl -0pi -e 's/private fun confirmFixedOverride\(h:Int\)\{.*?\n \}/private fun confirmFixedOverride(h:Int){bookingDialog(null,h)}/s' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          test -s project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          sed -i 's/versionCode = 1/versionCode = 2/; s/versionName = "1.0"/versionName = "1.1.0"/' project/app/build.gradle.kts
          cp -a project/. .
      - name: Upload Extracted Project Source
        uses: actions/upload-artifact@v4
        with:
          name: Hijoozati-Source
          path: project/
          if-no-files-found: error
          retention-days: 7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hijoozati-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
