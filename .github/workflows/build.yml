name: Build Hijoozati APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Hijoozati_Project.zip'
      - 'maintenance/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Project and Install Updated App Source
        run: |
          set -euo pipefail
          test -f Hijoozati_Project.zip
          mkdir project
          unzip -q Hijoozati_Project.zip -d project
          test -f project/settings.gradle.kts
          mkdir -p project/app/src/main/java/com/hijoozati/app
          base64 -d maintenance/MainActivity.kt.gz.b64 | gzip -dc > project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          test -s project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          python3 maintenance/patch.py
          grep -q 'advanceTournament(id:Long)' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          grep -q 'tournament_groups' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          grep -q 'playerBelongsToFixture' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          grep -q 'private fun hour(h:Int)' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          if grep -q 'hourRange' project/app/src/main/java/com/hijoozati/app/MainActivity.kt; then echo 'Unexpected booking time range formatter'; exit 1; fi
          sed -i 's/versionCode = [0-9][0-9]*/versionCode = 8/; s/versionName = "[^"]*"/versionName = "1.7.0"/' project/app/build.gradle.kts
          cp -a project/. .
      - name: Upload Extracted Project Source
        uses: actions/upload-artifact@v4
        with:
          name: Hijoozati-Source
          path: project/
          if-no-files-found: error
          retention-days: 14
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hijoozati-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
