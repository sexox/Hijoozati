name: Build Hijoozati APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Hijoozati_Project.zip'
      - 'maintenance/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Project and Install Updated App Source
        run: |
          test -f Hijoozati_Project.zip
          mkdir project
          unzip -q Hijoozati_Project.zip -d project
          test -f project/settings.gradle.kts
          mkdir -p project/app/src/main/java/com/hijoozati/app
          base64 -d maintenance/MainActivity.kt.gz.b64 | gzip -dc > project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          sed -i '/fun bookingsFor(/s/else it.hour})$/else it.hour}}/' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          sed -i '/fun fixedBookings(/s/else it.hour}}$/else it.hour})/' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          test -s project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          python3 - <<'PY'
          p='project/app/src/main/java/com/hijoozati/app/MainActivity.kt'
          s=open(p,encoding='utf-8').read()
          old=' private fun showApp(){root=LinearLayout(this).apply{orientation=1;layoutDirection=View.LAYOUT_DIRECTION_RTL;setBackgroundColor(Palette.bg);setPadding(dp(11),dp(5),dp(11),dp(5))};val sc=ScrollView(this).apply{isFillViewport=true};content=LinearLayout(this).apply{orientation=1};sc.addView(content);root.addView(sc,LinearLayout.LayoutParams(-1,0,1f));'
          new=' private fun showApp(){root=LinearLayout(this).apply{orientation=1;layoutDirection=View.LAYOUT_DIRECTION_RTL;setBackgroundColor(Palette.bg);setPadding(0,0,0,0)};val sc=ScrollView(this).apply{isFillViewport=true;clipToPadding=false};content=LinearLayout(this).apply{orientation=1;setPadding(dp(14),dp(8),dp(14),dp(8))};sc.addView(content,ScrollView.LayoutParams(-1,-2));root.addView(sc,LinearLayout.LayoutParams(-1,0,1f));'
          assert old in s, 'showApp layout signature not found'
          s=s.replace(old,new,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -q 'setPadding(dp(14),dp(8),dp(14),dp(8))' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          sed -i 's/versionCode = 1/versionCode = 3/; s/versionName = "1.0"/versionName = "1.2.0"/' project/app/build.gradle.kts
          cp -a project/. .
      - name: Upload Extracted Project Source
        uses: actions/upload-artifact@v4
        with:
          name: Hijoozati-Source
          path: project/
          if-no-files-found: error
          retention-days: 7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hijoozati-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
