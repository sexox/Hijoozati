name: Build Hijoozati APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Hijoozati_Project.zip'
      - 'maintenance/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Project and Install Updated App Source
        run: |
          test -f Hijoozati_Project.zip
          mkdir project
          unzip -q Hijoozati_Project.zip -d project
          test -f project/settings.gradle.kts
          mkdir -p project/app/src/main/java/com/hijoozati/app
          base64 -d maintenance/MainActivity.kt.gz.b64 | gzip -dc > project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          sed -i '/fun bookingsFor(/s/else it.hour})$/else it.hour}}/' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          sed -i '/fun fixedBookings(/s/else it.hour}}$/else it.hour})/' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          sed -i 's/val hours=(15..23).toList()+listOf(0)/val hours=(15..23).toList()/g' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          python3 - <<'PY'
          p='project/app/src/main/java/com/hijoozati/app/MainActivity.kt'
          s=open(p,encoding='utf-8').read()
          marker=' }\n private fun bookingPage(){'
          replacement='  gap(12);content.addView(txt("حجوزاتي • الإصدار 1.2.0",10f,Palette.muted).apply{gravity=Gravity.CENTER})\n }\n private fun bookingPage(){'
          if 'حجوزاتي • الإصدار 1.2.0' not in s:
              assert marker in s
              s=s.replace(marker,replacement,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -q 'حجوزاتي • الإصدار 1.2.0' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          ! grep -q 'val hours=(15..23).toList()+listOf(0)' project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          test -s project/app/src/main/java/com/hijoozati/app/MainActivity.kt
          sed -i 's/versionCode = 1/versionCode = 3/; s/versionName = "1.0"/versionName = "1.2.0"/' project/app/build.gradle.kts
          cp -a project/. .
      - name: Upload Extracted Project Source
        uses: actions/upload-artifact@v4
        with:
          name: Hijoozati-Source
          path: project/
          if-no-files-found: error
          retention-days: 7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hijoozati-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
